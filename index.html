<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign Forge</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="editor-panel" aria-label="Signature editor">
      <header class="brand-row">
        <img class="brand-mark" src="assets/company-mark.svg" alt="">
        <div>
          <p class="eyebrow">Signature builder</p>
          <h1>Sign Forge</h1>
        </div>
      </header>

      <nav class="tab-list" aria-label="Editor sections">
        <button class="tab-button active" type="button" data-tab="layouts">Layouts</button>
        <button class="tab-button" type="button" data-tab="style">Style</button>
        <button class="tab-button" type="button" data-tab="identity">Identity</button>
        <button class="tab-button" type="button" data-tab="media">Media</button>
        <button class="tab-button" type="button" data-tab="links">Links</button>
      </nav>

      <div class="panel-scroll">
        <section class="tab-panel active layout-panel" id="tab-layouts">
          <div class="section-head">
            <h2>Choose Layout</h2>
          </div>
          <div class="layout-scroll" aria-label="Layout choices">
            <div id="layoutGrid" class="layout-grid"></div>
          </div>
        </section>

        <section class="tab-panel" id="tab-identity">
          <div class="section-head">
            <h2>Profile</h2>
          </div>
          <div class="field-stack">
            <label class="field">
              <span>Full name</span>
              <input id="fullName" type="text" autocomplete="name">
            </label>
            <label class="field">
              <span>Job title</span>
              <input id="jobTitle" type="text">
            </label>
            <div class="two-col">
              <label class="field">
                <span>Company</span>
                <input id="company" type="text">
              </label>
              <label class="field">
                <span>Department</span>
                <input id="department" type="text">
              </label>
            </div>
            <label class="field">
              <span>Email</span>
              <input id="email" type="email" autocomplete="email">
            </label>
            <label class="field">
              <span>Phone</span>
              <input id="phone" type="tel" autocomplete="tel">
            </label>
            <label class="field">
              <span>Address</span>
              <input id="address" type="text" autocomplete="street-address">
            </label>
            <label class="field">
              <span>Website</span>
              <input id="website" type="url" inputmode="url">
            </label>
            <label class="field">
              <span>Signature line</span>
              <input id="tagline" type="text">
            </label>
            <div class="two-col">
              <label class="field">
                <span>Button label</span>
                <input id="ctaLabel" type="text">
              </label>
              <label class="field">
                <span>Button link</span>
                <input id="ctaUrl" type="url" inputmode="url">
              </label>
            </div>
          </div>
        </section>

        <section class="tab-panel" id="tab-media">
          <div class="section-head">
            <h2>Photo and Logo</h2>
          </div>
          <div class="field-stack">
            <label class="switch-row">
              <input id="showPhoto" type="checkbox">
              <span>Show profile photo</span>
            </label>
            <label class="field file-field">
              <span>Photo or GIF upload</span>
              <input id="photoUpload" type="file" accept="image/*,.gif">
            </label>
            <label class="field">
              <span>Photo or GIF URL</span>
              <input id="photoUrl" type="url" inputmode="url">
            </label>
            <label class="field">
              <span>Photo hyperlink</span>
              <input id="profileUrl" type="url" inputmode="url">
            </label>
            <div class="two-col">
              <label class="field">
                <span>Frame</span>
                <select id="photoFrame">
                  <option value="circle">Circle</option>
                  <option value="rounded">Rounded square</option>
                  <option value="soft">Soft rectangle</option>
                  <option value="arch">Arch</option>
                  <option value="diamond">Diamond</option>
                  <option value="hex">Hexagon</option>
                  <option value="ticket">Ticket</option>
                  <option value="stripe">Stripe edge</option>
                </select>
              </label>
              <label class="field range-field">
                <span>Photo size <output id="photoSizeValue"></output></span>
                <input id="photoSize" type="range" min="48" max="128" step="2">
              </label>
            </div>

            <div class="divider-line"></div>

            <label class="switch-row">
              <input id="showLogo" type="checkbox">
              <span>Show company logo</span>
            </label>
            <label class="field file-field">
              <span>Company logo upload</span>
              <input id="logoUpload" type="file" accept="image/*,.svg">
            </label>
            <label class="field">
              <span>Company logo URL</span>
              <input id="logoUrl" type="url" inputmode="url">
            </label>
            <label class="field">
              <span>Logo hyperlink</span>
              <input id="logoLink" type="url" inputmode="url">
            </label>
            <label class="field">
              <span>Logo position</span>
              <select id="logoPosition">
                <option value="auto">Auto by layout</option>
                <option value="top-left">Top left</option>
                <option value="top-center">Top middle</option>
                <option value="top-right">Top right</option>
                <option value="bottom-left">Bottom left</option>
                <option value="bottom-center">Bottom middle</option>
                <option value="bottom-right">Bottom right</option>
                <option value="middle-left">Middle left</option>
                <option value="middle-right">Middle right</option>
              </select>
            </label>
            <label class="field range-field">
              <span>Logo width <output id="logoWidthValue"></output></span>
              <input id="logoWidth" type="range" min="40" max="130" step="2">
            </label>
          </div>
        </section>

        <section class="tab-panel" id="tab-links">
          <div class="section-head">
            <h2>Logo Links</h2>
          </div>
          <div id="socialRows" class="social-list"></div>
          <div class="custom-link-row">
            <label class="field">
              <span>Custom name</span>
              <input id="customLabel" type="text">
            </label>
            <label class="field">
              <span>Custom URL</span>
              <input id="customUrl" type="url" inputmode="url">
            </label>
            <button id="addCustomLink" class="secondary-button" type="button">Add</button>
          </div>
        </section>

        <section class="tab-panel" id="tab-style">
          <div class="section-head">
            <h2>Visual Style</h2>
          </div>
          <div id="themeGrid" class="theme-grid"></div>
          <div class="field-stack style-fields">
            <div class="two-col">
              <label class="field color-field">
                <span>Accent</span>
                <input id="accentColor" type="color">
              </label>
              <label class="field color-field">
                <span>Text</span>
                <input id="textColor" type="color">
              </label>
            </div>
            <label class="field">
              <span>Font</span>
              <select id="fontFamily">
                <option value="Arial, Helvetica, sans-serif">Arial</option>
                <option value="Georgia, 'Times New Roman', serif">Georgia</option>
                <option value="'Trebuchet MS', Arial, sans-serif">Trebuchet</option>
                <option value="'Segoe UI', Arial, sans-serif">Segoe UI</option>
                <option value="'Courier New', monospace">Courier</option>
              </select>
            </label>
            <label class="field">
              <span>Contact markers</span>
              <select id="contactMarkerStyle">
                <option value="icons">Icons</option>
                <option value="letters">Letters E/P/W/A</option>
              </select>
            </label>
            <div class="two-col">
              <label class="field">
                <span>Icon shape</span>
                <select id="iconShape">
                  <option value="circle">Circle</option>
                  <option value="square">Square</option>
                  <option value="soft">Soft</option>
                  <option value="plain">Plain</option>
                </select>
              </label>
              <label class="field">
                <span>Background</span>
                <select id="bgMode">
                  <option value="transparent">Transparent</option>
                  <option value="tint">Soft tint</option>
                  <option value="solid">Solid card</option>
                  <option value="dark">Dark card</option>
                </select>
              </label>
            </div>
            <label class="field range-field">
              <span>Spacing <output id="densityValue"></output></span>
              <input id="density" type="range" min="8" max="24" step="1">
            </label>
            <label class="field range-field">
              <span>Signature width <output id="signatureWidthValue"></output></span>
              <input id="signatureWidth" type="range" min="360" max="760" step="10">
            </label>
            <label class="switch-row">
              <input id="showDivider" type="checkbox">
              <span>Show divider accents</span>
            </label>
          </div>
        </section>
      </div>
    </aside>

    <main class="preview-panel">
      <div class="preview-toolbar">
        <div>
          <p class="eyebrow">Live Preview</p>
          <h2>Make Your Email Signature</h2>
        </div>
        <div class="action-row">
          <button id="copySignature" class="primary-button" type="button">Copy for Gmail</button>
          <button id="copyHtml" class="secondary-button" type="button">Copy Gmail HTML</button>
          <button id="downloadHtml" class="secondary-button" type="button">Download</button>
          <button id="resetDemo" class="ghost-button" type="button">Reset</button>
        </div>
      </div>

      <div class="preview-viewport">
        <div id="signaturePreview" class="signature-preview" aria-live="polite"></div>
      </div>

      <section class="html-panel" aria-label="Generated HTML">
        <label for="htmlOutput">Generated HTML</label>
        <textarea id="htmlOutput" readonly spellcheck="false"></textarea>
      </section>
    </main>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="script.js"></script>
</body>
</html>
